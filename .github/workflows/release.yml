name: Generate Release Docs

on:
  push:
    paths:
      - "release"

jobs:
  SaltChangelog:
    name: Build Salt Changelog
    runs-on: ubuntu-latest

    container:
      image: python:3.8.6-slim-buster

    steps:

    - name: Install System Deps
      run: |
        echo "deb http://deb.debian.org/debian buster-backports main" >> /etc/apt/sources.list
        apt-get update
        apt-get install -y enchant git gcc imagemagick make zlib1g-dev libc-dev libffi-dev g++ libxml2 libxml2-dev libxslt-dev libcurl4-openssl-dev libssl-dev libgnutls28-dev xz-utils
        apt-get install -y git/buster-backports

    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Install Nox
      env:
        PIP_EXTRA_INDEX_URL: https://pypi-proxy.saltstack.net/root/local/+simple/
      run: |
        python -m pip install --upgrade pip
        pip install nox

    - id: changed-files
      name: Get Changed Files
      uses: dorny/paths-filter@v2
      with:
        token: ${{ github.token }}
        list-files: json
        filters: |
          docs:
            - doc/**

    - name: Install Python Requirements
      env:
        PIP_EXTRA_INDEX_URL: https://pypi-proxy.saltstack.net/root/local/+simple/
      run: |
        nox --install-only --forcecolor -e 'changelog(draft=False)' -- $(cat release)
        nox --install-only --forcecolor -e 'changelog(draft=True)' -- $(cat release)

    - name: Build Changelog
      env:
        SKIP_REQUIREMENTS_INSTALL: YES
      run: |
        nox --forcecolor -e 'changelog(draft=True)' -- $(cat release) > rn_changelog
        nox --forcecolor -e 'changelog(draft=False)' -- $(cat release)

    - name: Store Generated Changelog
      uses: actions/upload-artifact@v2
      with:
        name: salt-changelog
        path: |
          CHANGELOG.md
          changelog/*
          rn_changelog

  Manpages:
    name: Build Salt man Pages
    runs-on: ubuntu-latest

    container:
      image: python:3.8.6-slim-buster

    steps:

    - name: Install System Deps
      run: |
        echo "deb http://deb.debian.org/debian buster-backports main" >> /etc/apt/sources.list
        apt-get update
        apt-get install -y enchant git gcc imagemagick make zlib1g-dev libc-dev libffi-dev g++ libxml2 libxml2-dev libxslt-dev libcurl4-openssl-dev libssl-dev libgnutls28-dev
        apt-get install -y git/buster-backports

    - uses: actions/checkout@v2

    - id: changed-files
      name: Get Changed Files
      uses: dorny/paths-filter@v2
      with:
        token: ${{ github.token }}
        list-files: json
        filters: |
          docs:
            - doc/**

    - name: Install Nox
      if: github.event_name == 'push' || steps.changed-files.outputs.docs == 'true'
      env:
        PIP_EXTRA_INDEX_URL: https://pypi-proxy.saltstack.net/root/local/+simple/
      run: |
        python -m pip install --upgrade pip
        pip install nox

    - name: Install Python Requirements
      if: github.event_name == 'push' || steps.changed-files.outputs.docs == 'true'
      env:
        PIP_EXTRA_INDEX_URL: https://pypi-proxy.saltstack.net/root/local/+simple/
      run:
        nox --install-only --forcecolor -e 'docs-man(compress=False, update=True, clean=True)'

    - name: Build Manpages
      if: github.event_name == 'push' || steps.changed-files.outputs.docs == 'true'
      env:
        SKIP_REQUIREMENTS_INSTALL: YES
      run: |
        nox --forcecolor -e 'docs-man(compress=False, update=True, clean=True)'

    - name: Store Generated Documentation
      if: github.event_name == 'push' || steps.changed-files.outputs.docs == 'true'
      uses: actions/upload-artifact@v2
      with:
        name: salt-man-pages
        path: doc/_build/man

  PullRequest:
    needs: [SaltChangelog, Manpages]
    name: Create Pull Request
    runs-on: ubuntu-latest

    container:
      image: python:3.8.6-slim-buster

    steps:
    - name: Install System Deps
      run: |
        echo "deb http://deb.debian.org/debian buster-backports main" >> /etc/apt/sources.list
        apt-get update
        apt-get install -y enchant git gcc imagemagick make zlib1g-dev libc-dev libffi-dev g++ libxml2 libxml2-dev libxslt-dev libcurl4-openssl-dev libssl-dev libgnutls28-dev xz-utils
        apt-get install -y git/buster-backports

    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Download salt-man-pages
      uses: actions/download-artifact@v2
      with:
        name: salt-man-pages
        path: doc/man/

    - name: Download salt changelog
      uses: actions/download-artifact@v2
      with:
        name: salt-changelog

    - name: Generate Release Notes
      run: |
       sed -i '0,/^======/d' rn_changelog
       cat rn_changelog
       export SALT_VERSION=$(cat release); cat rn_changelog >> doc/topics/releases/${SALT_VERSION}.rst

    - name: Create Pull Request for Release
      uses: peter-evans/create-pull-request@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Add changelog and docs for release
        title: 'Generate Salt Man Page and Changelog'
        body: >
          This PR is auto-generated by 
          [create-pull-request](https://github.com/peter-evans/create-pull-request).

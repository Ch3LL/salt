name: Generate Tag and Github Release

on:
  workflow_dispatch:
    inputs:
      saltVersion:
        description: 'Salt Version'
        required: true

jobs:
  GenerateTagRelease:
    name: Generate Tag and Github Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v5.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ github.event.inputs.saltVersion }}
          dry_run: True

      - name: Set up Python 3.8
        uses: actions/setup-python@v1
        with:
          python-version: 3.8

      - name: Install pypa/build
        run: |
          python -m pip install build --user
      - name: Build a binary wheel and a source tarball
        run: |
          python -m build --sdist --outdir dist/ .
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.tag_version.outputs.new_tag }}
          name: Release v${{ steps.tag_version.outputs.new_tag }}
          body: v${{ steps.tag_version.outputs.new_tag }}
          artifact: dist/salt*.tar.gz
